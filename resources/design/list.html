<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOLETO — Book your tickets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>

/* ===== styles.css ===== */
/* ============================================================
   BOLETO — homepage (mirrors the original BOLETO layout)
   Light & professional, with a .dark theme class.
   ============================================================ */

:root {
  --accent: #0fb39a;
  --accent-d: #0a8f7c;
  --accent-l: #e6f7f3;

  --bg: #f5f7f9;
  --surface: #ffffff;
  --ink: #16202e;
  --ink-2: #46535f;
  --ink-3: #8a95a3;
  --line: #e7eaee;
  --line-2: #eef1f4;

  --head: #111d2b;
  --head-2: #1a2838;
  --head-ink: #f4f7fa;
  --head-ink-2: #9fadbd;

  --star: #f5a623;
  --pop: #ef7a32;
  --radius: 14px;
  --shadow-card: 0 1px 2px rgba(20,32,46,.06), 0 8px 22px rgba(20,32,46,.08);
  --shadow-pop: 0 18px 50px rgba(20,32,46,.22);
  --maxw: 1200px;
  --gut: clamp(16px, 4vw, 40px);
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

.dark {
  --bg: #0c1826;
  --surface: #12223a;
  --ink: #eaf1f8;
  --ink-2: #aebccd;
  --ink-3: #7c8aa0;
  --line: rgba(255,255,255,.09);
  --line-2: rgba(255,255,255,.06);
  --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.35);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.app { background: var(--bg); min-height: 100vh; transition: background .25s; }
img { display: block; max-width: 100%; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: inherit; text-decoration: none; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: rgba(120,130,145,.4); border-radius: 9px; }
.no-scroll { overflow: hidden; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--gut); }

/* ============================================================ HEADER */
.hdr { position: sticky; top: 0; z-index: 60; background: var(--head); color: var(--head-ink); box-shadow: 0 2px 18px rgba(0,0,0,.18); }
.hdr-in { display: flex; align-items: center; gap: 26px; height: 70px; }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 21px; letter-spacing: .3px; flex-shrink: 0; }
.logo-mark { width: 36px; height: 36px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-d)); display: grid; place-items: center; color: #fff; box-shadow: 0 4px 14px rgba(15,179,154,.45); flex-shrink: 0; }
.logo b { color: #fff; } .logo span { color: var(--accent); }

.nav { display: flex; align-items: center; gap: 22px; margin-left: 6px; }
.nav-item { position: relative; }
.nav-link { display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 700; color: var(--head-ink); padding: 24px 0; letter-spacing: .2px; white-space: nowrap; }
.nav-link:hover, .nav-link.on { color: var(--accent); }
.nav-link.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: 16px; height: 3px; background: var(--accent); border-radius: 3px; }
.nav-link .chev { transition: transform .2s; }
.nav-item:hover .chev { transform: rotate(180deg); }
.nav-drop { position: absolute; top: 100%; left: -14px; min-width: 184px; background: #fff; color: #16202e; border-radius: 10px; box-shadow: var(--shadow-pop); padding: 6px; opacity: 0; visibility: hidden; transform: translateY(6px); transition: .16s; z-index: 70; }
.nav-item:hover .nav-drop { opacity: 1; visibility: visible; transform: translateY(0); }
.nav-drop a { display: block; padding: 9px 13px; border-radius: 7px; font-size: 13.5px; font-weight: 600; }
.nav-drop a:hover { background: var(--accent-l); color: var(--accent-d); }

.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.city { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700; color: var(--head-ink); white-space: nowrap; }
.city:hover { color: var(--accent); } .city svg { color: var(--accent); }
.city .pin { color: var(--accent); }
.btn-join { background: linear-gradient(135deg, var(--accent), var(--accent-d)); color: #04201b; font-weight: 800; font-size: 13.5px; padding: 11px 22px; border-radius: 22px; letter-spacing: .4px; box-shadow: 0 6px 16px rgba(15,179,154,.4); }
.btn-join:hover { filter: brightness(1.06); transform: translateY(-1px); }
.hdr-burger { display: none; color: #fff; margin-left: auto; }

/* ============================================================ HERO */
.hero { position: relative; padding: clamp(48px, 9vw, 96px) 0 130px; overflow: hidden; color: #fff; text-align: center; }
.hero-bg { position: absolute; inset: 0; z-index: 0; }
.hero-bg img { width: 100%; height: 100%; object-fit: cover; }
.hero-veil { position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(10,18,28,.78), rgba(10,18,28,.62) 40%, rgba(10,18,28,.9)); }
.hero-in { position: relative; z-index: 2; }
.hero h1 { font-size: clamp(34px, 6.4vw, 70px); font-weight: 800; line-height: 1.02; letter-spacing: -1px; margin: 0; text-shadow: 0 4px 30px rgba(0,0,0,.5); }
.hero h1 .rot { color: var(--accent); position: relative; }
.hero h1 .rot::after { content: ""; display: inline-block; width: 3px; height: .9em; background: var(--accent); margin-left: 4px; vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.hero p { font-size: clamp(14px, 1.7vw, 19px); opacity: .92; margin: 18px auto 0; max-width: 54ch; }

/* search panel (overlaps hero) */
.searchp { position: relative; z-index: 5; margin-top: -86px; }
.searchp-card { background: linear-gradient(120deg, #233a6e, #2b2a72 55%, #5a2f8e); border-radius: 18px; padding: clamp(20px, 3vw, 30px); box-shadow: 0 24px 60px rgba(20,20,60,.4); color: #fff; }
.sp-top { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 20px; }
.sp-kicker { font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
.sp-title { font-size: clamp(20px, 2.6vw, 28px); font-weight: 800; margin-top: 4px; }
.sp-tabs { display: flex; gap: 10px; }
.sp-tab { display: flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 24px; font-size: 13.5px; font-weight: 700; background: rgba(255,255,255,.12); color: #fff; transition: .15s; }
.sp-tab:hover { background: rgba(255,255,255,.2); }
.sp-tab.on { background: linear-gradient(135deg, var(--accent), var(--accent-d)); color: #04201b; }
.sp-tab i { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.25); display: grid; place-items: center; }
.sp-tab.on i { background: rgba(0,0,0,.18); }

.sp-row { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 12px; background: rgba(255,255,255,.1); border-radius: 12px; padding: 10px; }
.sp-field { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.08); border-radius: 9px; padding: 0 14px; height: 50px; position: relative; }
.sp-field svg { color: var(--accent); flex-shrink: 0; }
.sp-field input { border: none; outline: none; background: transparent; color: #fff; font-size: 14px; font-family: inherit; width: 100%; }
.sp-field input::placeholder { color: rgba(255,255,255,.65); }
.sp-sel { display: flex; flex-direction: column; justify-content: center; flex: 1; min-width: 0; }
.sp-sel small { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,.6); font-weight: 700; }
.sp-sel button { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700; color: #fff; }
.sp-sel button .chev { margin-left: auto; }
.sp-search-btn { background: linear-gradient(135deg, var(--accent), var(--accent-d)); color: #04201b; width: 42px; height: 38px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0; }
.sp-menu { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #fff; color: #16202e; border-radius: 9px; box-shadow: var(--shadow-pop); padding: 5px; z-index: 30; }
.sp-menu button { display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 6px; font-size: 13.5px; font-weight: 600; }
.sp-menu button:hover { background: var(--accent-l); color: var(--accent-d); }

/* ============================================================ SECTIONS */
.section { padding: clamp(30px, 4vw, 50px) 0 0; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.sec-title { font-size: clamp(22px, 3vw, 32px); font-weight: 800; text-transform: uppercase; letter-spacing: -.2px; color: var(--ink); position: relative; padding-bottom: 12px; }
.sec-title::after { content: ""; position: absolute; left: 0; bottom: 0; width: 56px; height: 3px; background: var(--accent); border-radius: 3px; }
.see-all { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 700; font-size: 14px; }
.see-all:hover { color: var(--accent-d); gap: 7px; }

/* movies layout: sidebar + grid */
.movies-grid { display: grid; grid-template-columns: 232px 1fr; gap: 28px; align-items: start; }
.movies-main .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

/* sidebar */
.side { display: flex; flex-direction: column; gap: 20px; position: sticky; top: 86px; }
.promise { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; box-shadow: var(--shadow-card); }
.promise-row { display: flex; align-items: center; gap: 12px; padding: 12px 2px; }
.promise-row + .promise-row { border-top: 1px solid var(--line-2); }
.promise-row .pico { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-l); color: var(--accent-d); display: grid; place-items: center; flex-shrink: 0; }
.dark .promise-row .pico { background: rgba(15,179,154,.16); }
.promise-row b { font-size: 14px; font-weight: 700; color: var(--ink); }

.ad { border-radius: 14px; overflow: hidden; position: relative; min-height: 150px; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; color: #fff; box-shadow: var(--shadow-card); }
.ad img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
.ad .ad-veil { position: absolute; inset: 0; z-index: 1; }
.ad > * { position: relative; z-index: 2; }
.ad .ad-kicker { font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; background: rgba(0,0,0,.35); align-self: flex-start; padding: 4px 9px; border-radius: 5px; }
.ad .ad-title { font-size: 18px; font-weight: 800; line-height: 1.05; margin-top: 8px; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
.ad .ad-price { font-size: 22px; font-weight: 800; margin-top: 4px; }
.ad .ad-note { font-size: 12px; opacity: .9; margin-top: 6px; }
.ad .ad-cta { align-self: flex-start; margin-top: 12px; background: #fff; color: #14202e; font-weight: 800; font-size: 12.5px; padding: 8px 16px; border-radius: 7px; }
.ad .ad-cta:hover { background: var(--accent); }

.trend { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow-card); }
.trend h4 { margin: 0 0 10px; font-size: 15px; font-weight: 800; color: var(--ink); }
.trend a { display: block; padding: 9px 0; border-top: 1px solid var(--line-2); }
.trend a:first-of-type { border-top: none; }
.trend .tn { font-size: 13.5px; font-weight: 700; color: var(--ink); }
.trend a:hover .tn { color: var(--accent-d); }
.trend .tc { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }

/* ============================================================ MOVIE CARD */
.mcard { cursor: pointer; }
.mcard:hover .m-poster { transform: translateY(-5px); box-shadow: var(--shadow-pop); }
.m-poster { position: relative; aspect-ratio: 3/4; border-radius: 13px; overflow: hidden; box-shadow: var(--shadow-card); transition: transform .25s, box-shadow .25s; }
.m-poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.m-poster .m-tint { position: absolute; inset: 0; z-index: 1; }
.m-poster .m-fade { position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(0,0,0,0) 38%, rgba(0,0,0,.82)); }
.m-tag { position: absolute; top: 0; left: 0; z-index: 3; background: rgba(8,16,24,.62); backdrop-filter: blur(2px); padding: 6px 10px; border-radius: 0 0 9px 0; }
.m-tag b { color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .6px; display: block; }
.m-tag span { color: #fff; font-size: 8.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; opacity: .85; }
.m-ov { position: absolute; left: 13px; right: 13px; bottom: 13px; z-index: 3; color: #fff; }
.m-ov-title { font-size: 21px; font-weight: 800; line-height: 1; letter-spacing: -.3px; text-transform: uppercase; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
.m-ov-gen { font-size: 11.5px; opacity: .9; margin-top: 6px; }
.m-ov-rate { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; margin-top: 5px; }
.m-ov-rate .star { color: var(--star); }
.m-ov-rate .dot { opacity: .6; }
.m-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 3px 2px; }
.m-foot-name { font-size: 15px; font-weight: 700; color: var(--ink); }
.m-stats { display: flex; align-items: center; gap: 12px; }
.m-stat { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 800; }
.m-stat.crit { color: var(--accent-d); }
.m-stat.aud { color: var(--pop); }
.m-stat .ring { width: 17px; height: 17px; border-radius: 50%; border: 2.5px solid currentColor; }

/* ============================================================ EVENT / SPORT CARD */
.grid3-e { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.ecard { cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-card); transition: transform .25s, box-shadow .25s; }
.ecard:hover { transform: translateY(-5px); box-shadow: var(--shadow-pop); }
.e-img { position: relative; aspect-ratio: 16/11; }
.e-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.e-img .e-tint { position: absolute; inset: 0; z-index: 1; }
.e-date { position: absolute; top: 13px; left: 13px; z-index: 2; background: var(--accent); color: #04201b; border-radius: 11px; text-align: center; padding: 7px 11px; line-height: 1; box-shadow: 0 6px 16px rgba(15,179,154,.5); }
.e-date b { display: block; font-size: 18px; font-weight: 800; }
.e-date span { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; }
.e-time { position: absolute; top: 13px; right: 13px; z-index: 2; background: rgba(8,16,24,.7); color: #fff; font-size: 12px; font-weight: 800; padding: 6px 11px; border-radius: 8px; }
.e-body { padding: 16px 16px 18px; }
.e-name { font-size: 17px; font-weight: 800; color: var(--ink); line-height: 1.2; }
.e-meta { font-size: 13px; color: var(--ink-2); margin-top: 8px; display: flex; align-items: flex-start; gap: 6px; line-height: 1.4; }
.e-meta svg { color: var(--accent); flex-shrink: 0; margin-top: 2px; }
.e-price { font-size: 13px; color: var(--accent-d); font-weight: 800; margin-top: 12px; }

/* ============================================================ SUBSCRIBE */
.subscribe { position: relative; overflow: hidden; margin: clamp(40px,6vw,70px) 0 0; border-radius: 20px; padding: clamp(38px, 6vw, 64px) 24px; text-align: center; color: #fff; background: linear-gradient(120deg, #2b2a72, #4a2f8e 55%, #2f6f8e); box-shadow: 0 22px 54px rgba(40,30,90,.32); }
.sub-glow { position: absolute; inset: 0; z-index: 0; background: radial-gradient(46% 80% at 14% 8%, rgba(255,255,255,.18), transparent 60%), radial-gradient(46% 80% at 86% 92%, rgba(15,179,154,.4), transparent 62%); }
.subscribe > * { position: relative; z-index: 1; }
.sub-kicker { font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
.sub-h { font-size: clamp(22px, 3.6vw, 36px); font-weight: 800; text-transform: uppercase; margin: 8px 0 22px; }
.sub-form { display: flex; gap: 10px; max-width: 520px; margin: 0 auto; background: rgba(255,255,255,.14); padding: 7px; border-radius: 12px; }
.sub-form input { flex: 1; min-width: 0; border: none; outline: none; background: #fff; border-radius: 8px; padding: 13px 18px; font-size: 14.5px; font-family: inherit; color: #16202e; }
.sub-form button { background: linear-gradient(135deg, var(--accent), var(--accent-d)); color: #04201b; font-weight: 800; padding: 0 26px; border-radius: 8px; font-size: 14.5px; white-space: nowrap; }
.sub-form button:hover { filter: brightness(1.07); }
.sub-note { font-size: 13px; opacity: .9; margin: 16px 0 0; }

/* ============================================================ FOOTER */
.foot { background: var(--head); color: var(--head-ink-2); margin-top: clamp(36px,5vw,56px); padding: 40px 0 26px; }
.foot-in { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding-bottom: 26px; border-bottom: 1px solid rgba(255,255,255,.08); }
.foot-social { display: flex; gap: 10px; }
.foot-social a { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.08); display: grid; place-items: center; color: #fff; }
.foot-social a:hover { background: var(--accent); color: #04201b; }
.foot-bottom { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-top: 22px; font-size: 13px; }
.foot-bottom .links { display: flex; gap: 22px; flex-wrap: wrap; }
.foot-bottom a:hover { color: var(--accent); }
.foot-bottom b { color: var(--accent); font-weight: 700; }

/* ============================================================ CITY MODAL */
.city-back { position: fixed; inset: 0; z-index: 250; background: rgba(8,14,22,.6); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: flex-start; padding: clamp(20px, 9vh, 110px) 20px 20px; animation: fade .2s; overflow-y: auto; }
.city-modal { position: relative; background: var(--surface); color: var(--ink); width: min(960px, 100%); border-radius: 14px; box-shadow: var(--shadow-pop); padding: clamp(22px, 3vw, 34px); animation: citypop .25s cubic-bezier(.2,.8,.3,1.2); }
@keyframes citypop { from { transform: translateY(16px) scale(.97); opacity: 0; } }
.city-x { position: absolute; top: -46px; right: 0; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.14); color: #fff; display: grid; place-items: center; }
.city-x:hover { background: var(--accent); color: #04201b; }
@media (max-width: 560px) { .city-x { top: 8px; right: 8px; background: var(--bg); color: var(--ink); } }
.city-search { display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--line); border-radius: 10px; padding: 0 16px; height: 56px; }
.city-search:focus-within { border-color: var(--accent); }
.city-search svg { color: var(--ink-3); flex-shrink: 0; }
.city-search input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: var(--ink); font-size: 16px; font-family: inherit; }
.city-search input::placeholder { color: var(--ink-3); }
.city-detect { display: inline-flex; align-items: center; gap: 9px; color: var(--accent-d); font-weight: 700; font-size: 14.5px; padding: 16px 2px; border-bottom: 1px solid var(--line); width: 100%; }
.city-detect:hover { color: var(--accent); }
.city-pop-label { text-align: center; font-size: 15px; font-weight: 700; color: var(--ink); margin: 24px 0 20px; }
.city-pop { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
.city-pop-item { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 4px; border-radius: 10px; color: var(--ink-2); transition: .15s; }
.city-pop-item:hover { color: var(--accent-d); background: var(--accent-l); transform: translateY(-2px); }
.dark .city-pop-item:hover { background: rgba(15,179,154,.12); }
.city-pop-item.on { color: var(--accent-d); }
.city-pop-item span { font-size: 13px; font-weight: 600; }
.city-viewall { display: block; margin: 24px auto 4px; color: var(--accent-d); font-weight: 700; font-size: 14.5px; }
.city-viewall:hover { color: var(--accent); }
.city-results, .city-all { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 18px; }
.city-all { max-height: 240px; overflow-y: auto; padding-top: 8px; border-top: 1px solid var(--line); }
.city-result { text-align: left; padding: 11px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.city-result:hover { background: var(--accent-l); color: var(--accent-d); }
.dark .city-result:hover { background: rgba(15,179,154,.12); }
.city-result.on { color: var(--accent-d); font-weight: 800; }
.city-empty { grid-column: 1 / -1; text-align: center; color: var(--ink-3); padding: 30px; font-size: 14px; }
@media (max-width: 860px) { .city-pop { grid-template-columns: repeat(5, 1fr); row-gap: 16px; } }
@media (max-width: 480px) { .city-pop { grid-template-columns: repeat(3, 1fr); } }

/* scroll-top */
.totop { position: fixed; right: 22px; bottom: 22px; z-index: 90; width: 44px; height: 44px; border-radius: 11px; background: var(--accent); color: #04201b; display: grid; place-items: center; box-shadow: 0 8px 22px rgba(15,179,154,.5); opacity: 0; pointer-events: none; transition: .25s; }
.totop.show { opacity: 1; pointer-events: auto; }
.totop:hover { background: var(--accent-d); color: #fff; }

/* ============================================================ MODAL */
.modal-back { position: fixed; inset: 0; z-index: 200; background: rgba(8,14,22,.66); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 20px; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--surface); color: var(--ink); border-radius: 18px; width: min(840px, 100%); max-height: 90vh; overflow: hidden; display: grid; grid-template-columns: 290px 1fr; box-shadow: var(--shadow-pop); animation: pop .25s cubic-bezier(.2,.8,.3,1.2); }
@keyframes pop { from { transform: translateY(16px) scale(.97); opacity: 0; } }
.modal-poster { position: relative; }
.modal-poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.modal-poster .mp-fade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.1), rgba(0,0,0,.7)); }
.modal-poster .mp-name { position: absolute; left: 18px; right: 18px; bottom: 18px; z-index: 2; color: #fff; font-weight: 800; font-size: 25px; text-shadow: 0 2px 14px rgba(0,0,0,.6); }
.modal-body { padding: 26px 28px; overflow-y: auto; }
.modal-close { position: absolute; top: 14px; right: 16px; z-index: 10; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.92); color: #14202e; display: grid; place-items: center; }
.modal-close:hover { background: var(--accent); color: #fff; }
.m-h { font-size: 22px; font-weight: 800; margin: 0 0 6px; }
.m-rate { display: flex; align-items: center; gap: 7px; color: var(--ink-2); font-size: 13.5px; margin-bottom: 12px; }
.m-rate .star { color: var(--star); }
.m-tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.m-tag2 { font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); padding: 5px 11px; border-radius: 20px; }
.m-label { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-3); margin: 18px 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 9px; }
.chip { padding: 9px 15px; border-radius: 9px; border: 1.5px solid var(--line); font-size: 13.5px; font-weight: 700; color: var(--ink); transition: .15s; }
.chip:hover { border-color: var(--accent); color: var(--accent-d); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #04201b; }
.m-foot2 { display: flex; align-items: center; gap: 14px; margin-top: 24px; }
.m-price { font-size: 13.5px; color: var(--ink-2); } .m-price b { font-size: 21px; color: var(--ink); }
.btn-book { margin-left: auto; background: linear-gradient(135deg, var(--accent), var(--accent-d)); color: #04201b; font-weight: 800; font-size: 15px; padding: 13px 30px; border-radius: 9px; }
.btn-book:hover { filter: brightness(1.07); }
.book-done { text-align: center; padding: 28px 10px; }
.book-done .bd-ico { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-l); color: var(--accent-d); display: grid; place-items: center; margin: 0 auto 16px; }
.dark .book-done .bd-ico { background: rgba(15,179,154,.18); }

/* toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 300; background: var(--head); color: #fff; padding: 13px 22px; border-radius: 10px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-pop); display: flex; align-items: center; gap: 10px; animation: pop .25s; }
.toast .star { color: var(--accent); }

          <span className="links">{D.footer.links.map(l => <a key={l} onClick={() => onToast(l)}>{l}</a>)}</span>
        </div>
      </div>
    </footer>
  );
}

function ScrollTop() {
  const [show, setShow] = uS(false);
  uE(() => { const h = () => setShow(window.scrollY > 500); window.addEventListener("scroll", h); return () => window.removeEventListener("scroll", h); }, []);
  return <button className={"totop" + (show ? " show" : "")} onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}><Icon n="up" s={20} /></button>;
}

/* ---------- subscribe band (reused on every page) ---------- */
function SubscribeBand({ onToast }) {
  return (
    <div className="wrap">
      <div className="subscribe">
        <div className="sub-glow" />
        <div className="sub-kicker">Subscribe to BOLETO</div>
        <h3 className="sub-h">To get exclusive benefits</h3>
        <form className="sub-form" onSubmit={(e) => { e.preventDefault(); onToast && onToast("Subscribed — welcome to BOLETO!"); }}>
          <input type="email" required placeholder="Your email address" />
          <button type="submit">Subscribe</button>
        </form>
        <p className="sub-note">We respect your privacy, so we never share your info.</p>
      </div>
    </div>
  );
}

Object.assign(window, { Header, Hero, SearchPanel, Sidebar, BookingModal, Footer, ScrollTop, SubscribeBand });

  </script>
  <script type="text/babel">
/* BOLETO — main app */
const { useState: us, useEffect: ue } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": ["#0fb39a", "#0a8f7c", "#e6f7f3"],
  "dark": false
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const D = window.BOLETO_DATA;
  // "View all" listing — the catalog shown is derived from the URL path
  // (/movies, /events, /sports).
  const _path = location.pathname;
  const listType = _path.indexOf("movies") >= 0 ? "movie" : (_path.indexOf("sports") >= 0 ? "sport" : "event");
  const listData = listType === "movie" ? D.movies : (listType === "sport" ? D.sports : D.events);
  const listTitle = listType === "movie" ? "All Movies" : (listType === "sport" ? "All Sports" : "All Events");
  const [city, setCity] = us(window.BOLETO_DATA.selectedCity || D.cities[0]);
  const [modal, setModal] = us(null);
  const [toast, setToast] = us(null);

  ue(() => { if (!toast) return; const x = setTimeout(() => setToast(null), 2400); return () => clearTimeout(x); }, [toast]);
  const open = (item) => setModal(item);
  const booked = (item) => { setModal(null); setToast(`Booked ${item.title} 🎉`); };
  const toastMsg = (m) => setToast(m);

  const openTrend = (tr) => {
    const movie = D.movies.find(x => x.title.toLowerCase().includes(tr.name.toLowerCase().split(" ")[0]));
    if (movie) { location.href = "/movie?m=" + slugify(movie.title); return; }
    const other = [...D.events, ...D.sports].find(x => x.title.toLowerCase().includes(tr.name.toLowerCase().split(" ")[0]));
    if (other) { location.href = "/event?e=" + slugify(other.title); return; }
    setToast(`Searching "${tr.name}"`);
  };

  const rootStyle = { "--accent": t.accent[0], "--accent-d": t.accent[1], "--accent-l": t.accent[2] };

  return (
    <div id="top" className={"app" + (t.dark ? " dark" : "")} style={rootStyle}>
      <Header D={D} city={city} setCity={setCity} onToast={toastMsg} />

      <section className="section" style={{ paddingTop: 32 }}>
        <div className="wrap">
          {listType === "movie" ? (
            /* Movies — same sidebar + grid layout as the home Movies section */
            <div className="movies-grid">
              <Sidebar D={D} onToast={toastMsg} onOpenTrend={openTrend} />
              <div className="movies-main">
                <SecHead title={listTitle} />
                {listData.length === 0
                  ? <p style={{ color: "var(--ink-2)", padding: "30px 0" }}>Nothing here yet — check back soon.</p>
                  : <div className="grid3">{listData.map((m, i) => <MovieCard key={i} m={m} onOpen={(mm) => { location.href = "/movie?m=" + slugify(mm.title); }} />)}</div>}
              </div>
            </div>
          ) : (
            /* Events / Sports — full-width grid, same as the home sections */
            <React.Fragment>
              <SecHead title={listTitle} />
              {listData.length === 0
                ? <p style={{ color: "var(--ink-2)", padding: "30px 0" }}>Nothing here yet — check back soon.</p>
                : <div className="grid3-e">{listData.map((e, i) => <EventCard key={i} e={e} onOpen={(ev) => { location.href = "/event?e=" + slugify(ev.title); }} />)}</div>}
            </React.Fragment>
          )}
        </div>
      </section>

      <div className="wrap">
        <div className="subscribe" id="subscribe">
          <div className="sub-glow" />
          <div className="sub-kicker">Subscribe to BOLETO</div>
          <h3 className="sub-h">To get exclusive benefits</h3>
          <form className="sub-form" onSubmit={(e) => { e.preventDefault(); setToast("Subscribed — welcome to BOLETO!"); }}>
            <input type="email" required placeholder="Your email address" />
            <button type="submit">Subscribe</button>
          </form>
          <p className="sub-note">We respect your privacy, so we never share your info.</p>
        </div>
      </div>

      <Footer D={D} onToast={toastMsg} />
      <ScrollTop />

      {modal && <BookingModal item={modal} onClose={() => setModal(null)} onBooked={booked} />}
      {toast && <div className="toast"><Icon n="star" s={16} className="star" />{toast}</div>}

      <TweaksPanel>
        <TweakSection label="Theme" />
        <TweakToggle label="Dark theme" value={t.dark} onChange={(v) => setTweak("dark", v)} />
        <TweakColor label="Accent color" value={t.accent}
          options={[
            ["#0fb39a", "#0a8f7c", "#e6f7f3"],
            ["#10b981", "#059669", "#e7f8f1"],
            ["#e63950", "#c1142f", "#fdebee"],
            ["#7a4fd0", "#5a2fb0", "#efeafc"],
            ["#f0731e", "#cf5410", "#fdeee2"],
          ]}
          onChange={(v) => setTweak("accent", v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
